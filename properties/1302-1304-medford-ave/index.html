<head>

  <style>
    :root {
      --navy: #1b3e7a;
      --navy-light: #2050a0;
      --orange: #c9560a;
      --orange-light: #e06720;
      --cream: #f5f0e8;
      --warm-white: #faf7f2;
      --text-dark: #1a1a1a;
      --text-mid: #4a4a4a;
      --text-light: #7a7a7a;
      --border: #e0d8cc;
      --gold: #c8a96e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'Lato', sans-serif;
      color: var(--text-dark);
      background: var(--warm-white);
      font-size: 16px;
      line-height: 1.6;
    }

    /* ── TOP BAR ── */
    .topbar {
      background: var(--navy);
      padding: 8px 40px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 20px;
    }
    .topbar a {
      color: rgba(255,255,255,0.75);
      text-decoration: none;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .topbar a:hover { color: var(--orange-light); }
    .topbar svg { width: 15px; height: 15px; fill: currentColor; flex-shrink: 0; }

    /* ── HEADER ── */
    header {
      background: var(--navy);
      border-bottom: 1px solid rgba(255,255,255,0.08);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 16px rgba(0,0,0,0.25);
    }
    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 40px;
      height: 90px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo {
      display: flex;
      align-items: center;
      text-decoration: none;
      cursor: pointer;
      flex-shrink: 0;
    }
    .logo img {
      height: 88px;
      width: auto;
      display: block;
      object-fit: contain;
      mix-blend-mode: screen;
      transition: opacity 0.2s, transform 0.2s;
    }
    .logo:hover img { opacity: 0.85; transform: scale(1.03); }

    nav {
      display: flex;
      align-items: center;
      gap: 28px;
    }
    nav a {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      color: rgba(255,255,255,0.85);
      text-decoration: none;
      transition: color 0.2s;
    }
    nav a:hover { color: var(--orange-light); }

    /* ── DETAIL PAGE ── */
    .detail-wrap {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--navy);
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.3px;
      margin-bottom: 24px;
      transition: color 0.2s;
    }
    .back-link:hover { color: var(--orange); }

    .detail-header {
      border-bottom: 1px solid var(--border);
      padding-bottom: 24px;
      margin-bottom: 32px;
    }
    .detail-tag {
      display: inline-block;
      background: var(--cream);
      color: var(--orange);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 4px 12px;
      border-radius: 3px;
      margin-bottom: 12px;
    }
    .detail-addr {
      font-family: 'Playfair Display', serif;
      font-size: 38px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 6px;
      line-height: 1.2;
    }
    .detail-city {
      font-size: 16px;
      color: var(--text-light);
      margin-bottom: 16px;
    }
    .detail-stats {
      display: flex;
      gap: 22px;
      flex-wrap: wrap;
    }
    .detail-stat {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-mid);
    }
    .detail-stat svg {
      width: 16px;
      height: 16px;
      fill: var(--orange);
      flex-shrink: 0;
    }

    /* ── GALLERY ── */
    .gallery {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
    }
    .gallery-item {
      background: #fff;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      border: 1px solid var(--border);
      cursor: zoom-in;
      aspect-ratio: 4/3;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .gallery-item:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.12);
    }
    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* ── LIGHTBOX ── */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    }
    .lightbox-close,
    .lightbox-prev,
    .lightbox-next {
      position: absolute;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      transition: background 0.2s;
    }
    .lightbox-close:hover,
    .lightbox-prev:hover,
    .lightbox-next:hover { background: rgba(255,255,255,0.25); }
    .lightbox-close { top: 24px; right: 24px; }
    .lightbox-prev { left: 24px; top: 50%; transform: translateY(-50%); }
    .lightbox-next { right: 24px; top: 50%; transform: translateY(-50%); }
    .lightbox-counter {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* ── FOOTER ── */
    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.7);
      padding: 32px 40px;
      text-align: center;
      font-size: 13px;
      margin-top: 60px;
    }
    footer a { color: var(--orange-light); text-decoration: none; }
    footer a:hover { color: #fff; }

    @media (max-width: 900px) {
      .gallery { grid-template-columns: repeat(2, 1fr); }
      .detail-addr { font-size: 28px; }
      .header-inner { padding: 0 20px; }
      .detail-wrap { padding: 24px 20px; }
    }
    @media (max-width: 560px) {
      .gallery { grid-template-columns: 1fr; }
      .topbar { padding: 8px 20px; }
      nav { gap: 16px; }
      nav a { font-size: 11px; }
    }
  </style>

  <div class="lightbox" id="lightbox" onclick="if(event.target===this)closeLightbox()">
    <button class="lightbox-close" onclick="closeLightbox()" aria-label="Close">✕</button>
    <button class="lightbox-prev" onclick="prevPhoto()" aria-label="Previous">‹</button>
    <img id="lightboxImg" src="" alt=""/>
    <button class="lightbox-next" onclick="nextPhoto()" aria-label="Next">›</button>

  <script>
    const photos = ['01.jpeg','02.jpeg','03.jpeg','04.jpeg','05.jpeg','06.jpeg','07.jpeg'];
    let currentIdx = 0;

    document.querySelectorAll('.gallery-item').forEach(item => {
      item.addEventListener('click', () => {
        currentIdx = parseInt(item.getAttribute('data-idx'), 10);
        openLightbox();
      });
    });

    function openLightbox() {
      document.getElementById('lightboxImg').src = photos[currentIdx];
      document.getElementById('lightboxCounter').textContent = (currentIdx + 1) + ' / ' + photos.length;
      document.getElementById('lightbox').classList.add('open');
      document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
      document.getElementById('lightbox').classList.remove('open');
      document.body.style.overflow = '';
    }
    function nextPhoto() {
      currentIdx = (currentIdx + 1) % photos.length;
      openLightbox();
    }
    function prevPhoto() {
      currentIdx = (currentIdx - 1 + photos.length) % photos.length;
      openLightbox();
    }
    document.addEventListener('keydown', e => {
      if (!document.getElementById('lightbox').classList.contains('open')) return;
      if (e.key === 'Escape') closeLightbox();
      else if (e.key === 'ArrowRight') nextPhoto();
      else if (e.key === 'ArrowLeft') prevPhoto();
    });
  </script>
